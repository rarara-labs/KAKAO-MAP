<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>9월 4주 무선국 - 무선국 지도</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
    #header {
      background: linear-gradient(135deg,#1a237e,#3949ab);
      color:white; padding:12px 16px;
      display:flex; align-items:center; gap:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.3);
    }
    #header h1 { font-size:16px; font-weight:bold; flex:1; }
    #progress-badge {
      background:rgba(255,255,255,0.2);
      border-radius:12px; padding:3px 10px; font-size:12px; white-space:nowrap;
    }
    #toolbar {
      background:white; padding:8px 12px;
      display:flex; gap:8px; align-items:center;
      border-bottom:1px solid #e0e0e0;
    }
    #search-input {
      flex:1; padding:8px 14px;
      border:1.5px solid #c5cae9; border-radius:20px;
      font-size:14px; outline:none;
    }
    #search-input:focus { border-color:#3949ab; }
    #btn-fit {
      background:#3949ab; color:white; border:none;
      border-radius:16px; padding:8px 12px;
      font-size:13px; cursor:pointer; white-space:nowrap;
    }
    #app-container { display:flex; height:calc(100vh - 108px); }
    #map { flex:1; height:100%; }
    #side-panel {
      width:300px; background:white;
      border-left:1px solid #e0e0e0;
      overflow-y:auto; display:flex; flex-direction:column;
    }
    .side-header {
      padding:10px 14px; background:#e8eaf6;
      font-size:12px; font-weight:bold; color:#3949ab;
      position:sticky; top:0; z-index:1;
    }
    .side-item {
      padding:10px 14px; border-bottom:1px solid #f0f0f0;
      cursor:pointer; transition:background 0.15s;
      display:flex; align-items:flex-start; gap:8px;
    }
    .side-item:hover { background:#e8eaf6; }
    .side-item.done { background:#f1fdf4; }
    .si-check { font-size:18px; padding-top:1px; }
    .si-text { flex:1; }
    .si-name { font-size:13px; font-weight:bold; color:#1a237e; word-break:break-all; }
    .si-name.done { color:#888; text-decoration:line-through; }
    .si-addr { font-size:11px; color:#888; margin-top:2px; }
    .si-subs { font-size:11px; color:#5c6bc0; margin-top:3px; font-style:italic; }
    @media(max-width:767px) {
      #side-panel { display:none; }
      #map { height:calc(100vh - 108px); width:100%; }
    }
    /* 팝업 스타일 */
    .popup-name { font-size:13px; font-weight:bold; color:#1a237e; margin-bottom:3px; word-break:break-all; }
    .popup-badge {
      display:inline-block; font-size:10px; font-weight:bold;
      padding:1px 6px; border-radius:8px; margin-bottom:6px;
    }
    .badge-rep { background:#e8eaf6; color:#3949ab; }
    .badge-solo { background:#e8f5e9; color:#2e7d32; }
    .popup-addr { font-size:12px; color:#555; margin-bottom:6px; }
    /* 서브 국소 메모 박스 */
    .popup-subs {
      background:#f3f4ff;
      border-left:3px solid #3949ab;
      border-radius:0 6px 6px 0;
      padding:7px 10px;
      margin-bottom:8px;
    }
    .popup-subs-title {
      font-size:11px; font-weight:bold; color:#3949ab; margin-bottom:4px;
    }
    .popup-sub-item {
      font-size:11px; color:#333; padding:2px 0;
      border-bottom:1px solid #e0e3ff;
      word-break:break-all;
    }
    .popup-sub-item:last-child { border-bottom:none; }
    .popup-btns { display:flex; gap:6px; flex-wrap:wrap; }
    .popup-btn {
      flex:1; padding:7px 4px; border-radius:6px;
      font-size:12px; font-weight:bold;
      text-decoration:none; text-align:center; display:block;
      cursor:pointer; border:none;
    }
    .btn-nav { background:#FFCD00; color:#333; }
    .btn-view { background:#1a237e; color:white; }
    .btn-done { background:#2e7d32; color:white; width:100%; margin-top:4px; }
    .btn-undone { background:#e0e0e0; color:#555; width:100%; margin-top:4px; }
  </style>
</head>
<body>
<div id="header">
  <span style="font-size:18px">📡</span>
  <h1>9월 4주 무선국</h1>
  <a href="./index.html" style="color:rgba(255,255,255,0.8);text-decoration:none;font-size:13px;white-space:nowrap;">← 목록</a>
  <div id="progress-badge">완료 0/21</div>
</div>
<div id="toolbar">
  <input id="search-input" type="search" placeholder="호출명칭 또는 주소 검색..." oninput="filterMarkers(this.value)">
  <button id="btn-fit" onclick="fitAll()">전체보기</button>
</div>
<div id="app-container">
  <div id="map"></div>
  <div id="side-panel">
    <div class="side-header" id="side-header">목록 (21)</div>
    <div id="side-list"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var STATIONS = [{"name": "SKL사천봉계3LTRO", "lat": 35.1148826988382, "lng": 127.927564410224, "origAddr": "사천시 곤명면 봉계리 산22-6", "type": "대표", "subs": [{"name": "SKL사천봉계3LTROM", "origAddr": "사천시 곤명면 봉계리 산22-6"}, {"name": "SK사천봉계3WTRO", "origAddr": "사천시 곤명면 봉계리 산22-6"}]}, {"name": "SKL사천봉계2LTRO", "lat": 35.1157935833351, "lng": 127.930351065793, "origAddr": "사천시 곤명면 봉계리 산26-1", "type": "대표", "subs": [{"name": "SKL사천봉계2LTROM", "origAddr": "사천시 곤명면 봉계리 산26-1"}, {"name": "SK사천봉계2WTRO", "origAddr": "사천시 곤명면 봉계리 산26-1"}]}, {"name": "SKL사천봉계LTRO", "lat": 35.1170007214046, "lng": 127.935796429047, "origAddr": "사천시 곤명면 봉계리 산41-15", "type": "대표", "subs": [{"name": "SKL사천봉계LTROM", "origAddr": "사천시 곤명면 봉계리 산41-15"}, {"name": "SK사천봉계WTRO", "origAddr": "사천시 곤명면 봉계리 산41-15"}]}, {"name": "SKL사천송림LTRO", "lat": 35.1184799035359, "lng": 127.943710728396, "origAddr": "사천시 곤명면 송림리 산84-1", "type": "대표", "subs": [{"name": "SKL사천송림LTROM", "origAddr": "사천시 곤명면 송림리 산84-1"}, {"name": "SK사천송림WTRO", "origAddr": "사천시 곤명면 송림리 산84-1"}]}, {"name": "SKLKTX사천신흥2LTRO", "lat": 35.1391721134662, "lng": 127.986099320875, "origAddr": "사천시 곤명면 신흥리 산72-1", "type": "대표", "subs": [{"name": "SKLKTX사천신흥2LTROM", "origAddr": "사천시 곤명면 신흥리 산72-1"}, {"name": "SKKTX사천신흥2WTRO", "origAddr": "사천시 곤명면 신흥리 산72-1"}]}, {"name": "SK사천용산RU", "lat": 35.0892430363881, "lng": 127.925339854285, "origAddr": "사천시 곤명면 용산리 155", "type": "단독", "subs": []}, {"name": "SKL사천정곡 LTRO", "lat": 35.1329947369685, "lng": 127.974423945135, "origAddr": "사천시 곤명면 정곡리 263-3", "type": "대표", "subs": [{"name": "SKL사천정곡 LTROM", "origAddr": "사천시 곤명면 정곡리 263-3"}, {"name": "SK사천정곡 WTRO", "origAddr": "사천시 곤명면 정곡리 263-3"}]}, {"name": "SKL사천곤명LRRU0_F4", "lat": 35.1321897580468, "lng": 127.976999996891, "origAddr": "사천시 곤명면 정곡리 857-3", "type": "단독", "subs": []}, {"name": "SKL사천초량RUM", "lat": 35.1076338392543, "lng": 127.910148086732, "origAddr": "사천시 곤명면 초량리 547-8", "type": "단독", "subs": []}, {"name": "SKL사천초량LTRO", "lat": 35.1097006650415, "lng": 127.907059081455, "origAddr": "사천시 곤명면 초량리 산70-1", "type": "대표", "subs": [{"name": "SKL사천초량LTROM", "origAddr": "사천시 곤명면 초량리 산70-1"}, {"name": "SK사천초량WTRO", "origAddr": "사천시 곤명면 초량리 산70-1"}]}, {"name": "SK사천추천4WIC", "lat": 35.0733318627299, "lng": 127.952887375395, "origAddr": "사천시 곤명면 추천리 13-16", "type": "단독", "subs": []}, {"name": "SKL사천미사일부대LTRO", "lat": 35.057500705341, "lng": 127.95963280613, "origAddr": "사천시 곤양면 서정리 산38-1", "type": "대표", "subs": [{"name": "SKL사천미사일부대LTROM", "origAddr": "사천시 곤양면 서정리 산38-1"}, {"name": "SK사천미사일부대WTRO", "origAddr": "사천시 곤양면 서정리 산38-1"}]}, {"name": "공동망_SKG사천항공우주3(기)AAU_1_2", "lat": 35.0772641977725, "lng": 128.064823588089, "origAddr": "사천시 사남면 유천리 802 한국항공우주산업  (유천리)", "type": "단독", "subs": []}, {"name": "공동망_SKG사천항공우주5AAU_1_2", "lat": 35.0772641977725, "lng": 128.064823588089, "origAddr": "사천시 사남면 유천리 802 한국항공우주산업  (유천리)", "type": "단독", "subs": []}, {"name": "공동망_SKG사천항공우주AAU_1_2", "lat": 35.0772641977725, "lng": 128.064823588089, "origAddr": "사천시 사남면 유천리 802 한국항공우주산업  (유천리)", "type": "단독", "subs": []}, {"name": "SKL사천케이블카휴양림LRRU_F2", "lat": 35.0327561700529, "lng": 127.992248454753, "origAddr": "사천시 서포면 조도리 442", "type": "단독", "subs": []}, {"name": "공동망_SKG사천가산3AAU_1_2", "lat": 35.0873300238902, "lng": 128.042933244068, "origAddr": "사천시 축동면 가산리 628-3 나대지", "type": "대표", "subs": []}, {"name": "공동망_SKG사천축동AAUPRU_1_3", "lat": 35.0849255372244, "lng": 128.039505225153, "origAddr": "사천시 축동면 가산리 783, 나대지  (가산리)", "type": "단독", "subs": []}, {"name": "공동망_SKG사천구호AAU_1_2", "lat": 35.0875833751275, "lng": 128.053142946541, "origAddr": "사천시 축동면 구호리 608-17 나대지", "type": "대표", "subs": [{"name": "SKL사천구호LRRU_F1", "origAddr": "사천시 축동면 구호리 608-17 나대지"}, {"name": "SKL사천구호LRRU_F2", "origAddr": "사천시 축동면 구호리 608-17 나대지"}, {"name": "SKT사천구호LRRU_F5", "origAddr": "사천시 축동면 구호리 608-17 나대지"}]}, {"name": "공동망_SKG사천사다AAU_1_3", "lat": 35.1073623853349, "lng": 128.087053575448, "origAddr": "사천시 축동면 배춘리 799-1 나대지", "type": "단독", "subs": []}, {"name": "SK길평리FDW", "lat": 35.1106879420098, "lng": 128.078731779061, "origAddr": "사천시 축동면 사다리 418-2", "type": "단독", "subs": []}];
var STORAGE_KEY = 'done_9월_4주_무선국';
var total = STATIONS.length;

var map = L.map('map').setView([35.09764, 127.99134], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

function makeIcon(done, type) {
  var bg = done ? '#2e7d32' : (type === '대표' ? '#283593' : '#1a237e');
  var emoji = done ? '✅' : '📡';
  var size = type === '대표' ? 32 : 28;
  return L.divIcon({
    className: '',
    html: '<div style="background:' + bg + ';color:white;border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;font-size:' + (size-14) + 'px;box-shadow:0 2px 6px rgba(0,0,0,0.4);border:2px solid white;">' + emoji + '</div>',
    iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2]
  });
}

var doneSet = {};
try { doneSet = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}

function saveDone() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(doneSet)); } catch(e) {}
  updateProgress();
}

function updateProgress() {
  var cnt = Object.keys(doneSet).filter(function(k){ return doneSet[k]; }).length;
  document.getElementById('progress-badge').textContent = '완료 ' + cnt + '/' + total;
}

var markers = [];

STATIONS.forEach(function(s, idx) {
  var done = !!doneSet[idx];
  var m = L.marker([s.lat, s.lng], {icon: makeIcon(done, s.type)}).addTo(map);

  function buildPopup() {
    var isDone = !!doneSet[idx];
    var enc = encodeURIComponent(s.name);
    var navUrl = 'https://map.kakao.com/link/to/' + enc + ',' + s.lat + ',' + s.lng;
    var viewUrl = 'https://map.kakao.com/link/map/' + enc + ',' + s.lat + ',' + s.lng;

    // 배지
    var badge = s.type === '대표'
      ? '<span class="popup-badge badge-rep">대표</span>'
      : (s.type === '단독' ? '<span class="popup-badge badge-solo">단독</span>' : '');

    // 서브 국소 메모 박스 (대표일 때만)
    var subsHtml = '';
    if (s.subs && s.subs.length > 0) {
      var items = s.subs.map(function(sub) {
        return '<div class="popup-sub-item">📶 ' + sub.name + '</div>';
      }).join('');
      subsHtml = '<div class="popup-subs">' +
        '<div class="popup-subs-title">🔗 함께 수검할 서브 국소 (' + s.subs.length + '개)</div>' +
        items + '</div>';
    }

    var doneBtn = isDone
      ? '<button class="popup-btn btn-undone" onclick="toggleDone(' + idx + ')">↩️ 완료 취소</button>'
      : '<button class="popup-btn btn-done" onclick="toggleDone(' + idx + ')">✅ 완료</button>';

    return '<div class="popup-name">' + (isDone ? '✅ ' : '📡 ') + s.name + '</div>' +
      badge +
      '<div class="popup-addr">📌 ' + s.origAddr + '</div>' +
      subsHtml +
      '<div class="popup-btns">' +
      '<a class="popup-btn btn-nav" href="' + navUrl + '" target="_blank">🚗 경로안내</a>' +
      '<a class="popup-btn btn-view" href="' + viewUrl + '" target="_blank">🗺️ 지도보기</a>' +
      '</div>' + doneBtn;
  }

  m.bindPopup(buildPopup, {maxWidth:290});
  markers.push({marker:m, station:s, visible:true, idx:idx});
});

window.toggleDone = function(idx) {
  doneSet[idx] = !doneSet[idx];
  saveDone();
  var e = markers[idx];
  e.marker.setIcon(makeIcon(!!doneSet[idx], e.station.type));
  e.marker.openPopup();
  renderSideList(markers.filter(function(x){ return x.visible; }));
};

updateProgress();

function fitAll() {
  var v = markers.filter(function(e){ return e.visible; });
  if (!v.length) return;
  map.fitBounds(L.featureGroup(v.map(function(e){ return e.marker; })).getBounds().pad(0.1));
}
fitAll();

function filterMarkers(kw) {
  kw = kw.trim().toLowerCase();
  var shown = [];
  markers.forEach(function(e) {
    var subMatch = e.station.subs && e.station.subs.some(function(sub) {
      return sub.name.toLowerCase().indexOf(kw) >= 0;
    });
    var m = !kw
      || e.station.name.toLowerCase().indexOf(kw) >= 0
      || e.station.origAddr.toLowerCase().indexOf(kw) >= 0
      || subMatch;
    e.visible = m;
    if (m) { e.marker.addTo(map); shown.push(e); } else map.removeLayer(e.marker);
  });
  renderSideList(shown);
  if (kw && shown.length) fitAll();
}

function renderSideList(list) {
  document.getElementById('side-header').textContent = '목록 (' + list.length + ')';
  var sl = document.getElementById('side-list');
  sl.innerHTML = '';
  list.forEach(function(e) {
    var isDone = !!doneSet[e.idx];
    var d = document.createElement('div');
    d.className = 'side-item' + (isDone ? ' done' : '');
    var subsInfo = (e.station.subs && e.station.subs.length > 0)
      ? '<div class="si-subs">🔗 서브 ' + e.station.subs.length + '개 포함</div>'
      : '';
    d.innerHTML =
      '<div class="si-check">' + (isDone ? '✅' : '⬜') + '</div>' +
      '<div class="si-text">' +
        '<div class="si-name' + (isDone ? ' done' : '') + '">' + e.station.name + '</div>' +
        '<div class="si-addr">' + e.station.origAddr + '</div>' +
        subsInfo +
      '</div>';
    d.onclick = function() { map.setView([e.station.lat, e.station.lng], 17); e.marker.openPopup(); };
    sl.appendChild(d);
  });
}
renderSideList(markers);
</script>
</body>
</html>
